name: Deploy to Itch.io

on:
  workflow_dispatch:

jobs:
  buildWebGL:
    name: Build WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildsPath: build

      - uses: actions/upload-artifact@v4
        with:
          name: build-WebGL
          path: build/WebGL

  buildAndroid:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildsPath: build
          allowDirtyBuild: true

      - uses: actions/upload-artifact@v4
        with:
          name: build-Android
          path: build/Android

  deployWebGL:
    name: Deploy WebGL to Itch
    runs-on: ubuntu-latest
    needs: buildWebGL
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-WebGL
          path: build/WebGL

      - name: Butler Push WebGL
        uses: josephbmanley/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: html5
          ITCH_GAME: topor
          ITCH_USER: peryloth
          PACKAGE: build/WebGL

  deployAndroid:
    name: Deploy Android to Itch
    runs-on: ubuntu-latest
    needs: buildAndroid
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-Android
          path: build/Android

      - name: Butler Push Android
        uses: josephbmanley/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: android
          ITCH_GAME: topor
          ITCH_USER: peryloth
          PACKAGE: build/Android
