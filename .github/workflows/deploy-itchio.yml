name: Deploy to Itch.io

on:
  workflow_dispatch:

jobs:
  buildWebGL:
    name: Build WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildsPath: build

      - uses: actions/upload-artifact@v4
        with:
          name: build-WebGL
          path: build/WebGL

  buildAndroid:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildsPath: build
          allowDirtyBuild: true

      - uses: actions/upload-artifact@v4
        with:
          name: build-Android
          path: build/Android

  build-pc:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows
            runner: windows-latest
            target: StandaloneWindows64
            artifact: ToporV3-Windows
            artifactName: build-Windows
            path: build/Windows/
            channel: windows
          - os: macOS
            runner: macos-latest
            target: StandaloneOSX
            artifact: ToporV3-macOS
            artifactName: build-macOS
            path: build/macOS/
            channel: macos
          - os: Linux
            runner: ubuntu-latest
            target: StandaloneLinux64
            artifact: ToporV3-Linux
            artifactName: build-Linux
            path: build/Linux/
            channel: linux
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.target }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.target }}-
            Library-

      - name: Setup Unity
        uses: game-ci/unity-installer@v4
        with:
          unityVersion: 6000.0.38f1
          cacheKey: unity-${{ matrix.os }}

      - name: Install Linux dependencies
        if: matrix.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgconf-2-4 libglu1-mesa

      - name: Build ${{ matrix.os }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.target }}
          buildName: ${{ matrix.artifact }}
          outputPath: build
          customParameters: -executeMethod BuildScript.PerformBuild

      - name: Upload ${{ matrix.os }} Build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.path }}
          retention-days: 7

  deployWebGL:
    name: Deploy WebGL to Itch
    runs-on: ubuntu-latest
    needs: buildWebGL
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-WebGL
          path: build/WebGL

      - name: Butler Push WebGL
        uses: josephbmanley/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: html5
          ITCH_GAME: topor
          ITCH_USER: peryloth
          PACKAGE: build/WebGL

  deployAndroid:
    name: Deploy Android to Itch
    runs-on: ubuntu-latest
    needs: buildAndroid
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-Android
          path: build/Android

      - name: Butler Push Android
        uses: josephbmanley/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: android
          ITCH_GAME: topor
          ITCH_USER: peryloth
          PACKAGE: build/Android

  deployWindows:
    name: Deploy Windows to Itch
    runs-on: ubuntu-latest
    needs: build-pc
    if: always() && contains(needs.build-pc.result, 'success')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-Windows
          path: build/Windows

      - name: Butler Push Windows
        uses: josephbmanley/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: windows
          ITCH_GAME: topor
          ITCH_USER: peryloth
          PACKAGE: build/Windows

  deployMacOS:
    name: Deploy macOS to Itch
    runs-on: ubuntu-latest
    needs: build-pc
    if: always() && contains(needs.build-pc.result, 'success')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-macOS
          path: build/macOS

      - name: Butler Push macOS
        uses: josephbmanley/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: macos
          ITCH_GAME: topor
          ITCH_USER: peryloth
          PACKAGE: build/macOS

  deployLinux:
    name: Deploy Linux to Itch
    runs-on: ubuntu-latest
    needs: build-pc
    if: always() && contains(needs.build-pc.result, 'success')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-Linux
          path: build/Linux

      - name: Butler Push Linux
        uses: josephbmanley/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: linux
          ITCH_GAME: topor
          ITCH_USER: peryloth
          PACKAGE: build/Linux