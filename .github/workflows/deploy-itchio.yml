name: Deploy to Itch.io

on:
  workflow_dispatch:

jobs:
  buildWebGL:
    name: Build WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildsPath: build

      - uses: actions/upload-artifact@v4
        with:
          name: build-WebGL
          path: build/WebGL

  buildAndroid:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildsPath: build
          allowDirtyBuild: true

      - uses: actions/upload-artifact@v4
        with:
          name: build-Android
          path: build/Android

  deployWebGL:
    name: Deploy WebGL to Itch
    runs-on: ubuntu-latest
    needs: buildWebGL
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-WebGL
          path: build/WebGL

      - name: Butler Push WebGL
        uses: josephbmanley/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: html5
          ITCH_GAME: topor
          ITCH_USER: peryloth
          PACKAGE: build/WebGL

  deployAndroid:
    name: Deploy Android to Itch
    runs-on: ubuntu-latest
    needs: buildAndroid
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-Android
          path: build/Android

      - name: Butler Push Android
        uses: josephbmanley/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: android
          ITCH_GAME: topor
          ITCH_USER: peryloth
          PACKAGE: build/Android

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Unity
        uses: game-ci/unity-installer@v4
        with:
          unityVersion: 6000.0.38f1
          cacheKey: unity-windows

      - name: Build Windows
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: ToporV3-Windows
          outputPath: build
          customParameters: -executeMethod BuildScript.PerformBuild

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: build-Windows
          path: build/Windows/

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Unity
        uses: game-ci/unity-installer@v4
        with:
          unityVersion: 6000.0.38f1
          cacheKey: unity-macos

      - name: Build macOS
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneOSX
          buildName: ToporV3-macOS
          outputPath: build
          customParameters: -executeMethod BuildScript.PerformBuild

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: build-macOS
          path: build/macOS/

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Unity
        uses: game-ci/unity-installer@v4
        with:
          unityVersion: 6000.0.38f1
          cacheKey: unity-linux

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgconf-2-4 libglu1-mesa

      - name: Build Linux
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          buildName: ToporV3-Linux
          outputPath: build
          customParameters: -executeMethod BuildScript.PerformBuild

      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: build-Linux
          path: build/Linux/

  deployWindows:
    name: Deploy Windows to Itch
    runs-on: ubuntu-latest
    needs: build-windows
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-Windows
          path: build/Windows

      - name: Butler Push Windows
        uses: josephbmanley/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: windows
          ITCH_GAME: topor
          ITCH_USER: peryloth
          PACKAGE: build/Windows

  deployMacOS:
    name: Deploy macOS to Itch
    runs-on: ubuntu-latest
    needs: build-macos
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-macOS
          path: build/macOS

      - name: Butler Push macOS
        uses: josephbmanley/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: macos
          ITCH_GAME: topor
          ITCH_USER: peryloth
          PACKAGE: build/macOS

  deployLinux:
    name: Deploy Linux to Itch
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-Linux
          path: build/Linux

      - name: Butler Push Linux
        uses: josephbmanley/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: linux
          ITCH_GAME: topor
          ITCH_USER: peryloth
          PACKAGE: build/Linux
