name: Deploy to Itch.io

on:
  workflow_dispatch:

jobs:
  build-linux-platforms:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - Android
          - WebGL
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Build ${{ matrix.targetPlatform }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildsPath: build

      - name: Upload ${{ matrix.targetPlatform }} Build
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}

  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneWindows64-
            Library-

      - name: Build Windows
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: ToporV3-Windows
          outputPath: build
          unityVersion: 6000.0.38f1

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: build-Windows
          path: build/Windows/

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneOSX-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneOSX-
            Library-

      - name: Build macOS
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneOSX
          buildName: ToporV3-macOS
          outputPath: build
          unityVersion: 6000.0.38f1

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: build-macOS
          path: build/macOS/

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneLinux64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneLinux64-
            Library-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa

      - name: Build Linux
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          buildName: ToporV3-Linux
          outputPath: build
          unityVersion: 6000.0.38f1

      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: build-Linux
          path: build/Linux/

  deployWebGL:
    name: Deploy WebGL to Itch
    runs-on: ubuntu-latest
    needs: build-linux-platforms
    if: always() && contains(needs.build-linux-platforms.result, 'success')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-WebGL
          path: build/WebGL

      - name: Butler Push WebGL
        uses: josephbmanley/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: html5
          ITCH_GAME: topor
          ITCH_USER: peryloth
          PACKAGE: build/WebGL

  deployAndroid:
    name: Deploy Android to Itch
    runs-on: ubuntu-latest
    needs: build-linux-platforms
    if: always() && contains(needs.build-linux-platforms.result, 'success')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-Android
          path: build/Android

      - name: Butler Push Android
        uses: josephbmanley/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: android
          ITCH_GAME: topor
          ITCH_USER: peryloth
          PACKAGE: build/Android

  deployWindows:
    name: Deploy Windows to Itch
    runs-on: ubuntu-latest
    needs: build-windows
    if: always() && contains(needs.build-windows.result, 'success')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-Windows
          path: build/Windows

      - name: Butler Push Windows
        uses: josephbmanley/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: windows
          ITCH_GAME: topor
          ITCH_USER: peryloth
          PACKAGE: build/Windows

  deployMacOS:
    name: Deploy macOS to Itch
    runs-on: ubuntu-latest
    needs: build-macos
    if: always() && contains(needs.build-macos.result, 'success')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-macOS
          path: build/macOS

      - name: Butler Push macOS
        uses: josephbmanley/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: macos
          ITCH_GAME: topor
          ITCH_USER: peryloth
          PACKAGE: build/macOS

  deployLinux:
    name: Deploy Linux to Itch
    runs-on: ubuntu-latest
    needs: build-linux
    if: always() && contains(needs.build-linux.result, 'success')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-Linux
          path: build/Linux

      - name: Butler Push Linux
        uses: josephbmanley/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: linux
          ITCH_GAME: topor
          ITCH_USER: peryloth
          PACKAGE: build/Linux